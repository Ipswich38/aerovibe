  <g transform="translate(670,170)">
    <rect x="0" y="0" width="430" height="430" rx="34" fill="#1d1d20" stroke="#52525b" stroke-width="2"/>
    <circle cx="215" cy="215" r="118" fill="none" stroke="#8b8b93" stroke-width="18"/>
