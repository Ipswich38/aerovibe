  <text x="600" y="86" text-anchor="middle" fill="#F4F4F5" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Controller Direction Guide</text>
  <text x="600" y="120" text-anchor="middle" fill="#A1A1AA" font-family="Arial, Helvetica, sans-serif" font-size="18">Use this before the field sequence</text>

